onboarding = false

[keys]
prefix = "ctrl+q"

[ui]
agent_panel_sort = "spaces"

[ui.toast]
delivery = "herdr"

[experimental]
switch_ascii_input_source_in_prefix = true

[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
sidebar_bg = "#181825"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "~/.config/herdr/open-space.sh"
width = "80%"
height = "80%"
