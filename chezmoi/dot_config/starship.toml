add_newline = false

format = """
$cmd_duration $directory$git_branch$git_state$git_status
  $python$character"""

[character]
success_symbol = "[●](green) [▶](purple)"
error_symbol = "[●](red) [▶](red)"
vimcmd_symbol = "[●](green) [◀](green)"

[package]
disabled = true

[cmd_duration]
min_time = 0
format = '[](fg:67)[󰪢 $duration](bg:67 fg:255)[](fg:67)'

[directory]
home_symbol = " "
read_only = "  "
style = "bg:240 fg:255"
truncation_length = 3
truncation_symbol = ".../"
format = '[](fg:240)[󰉋 → $path]($style)[](fg:240)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "
"Developer" = "  "

[git_branch]
symbol = "󰘬"
truncation_length = 16
truncation_symbol = "…"
format = " [](fg:252)[$symbol $branch](fg:235 bg:252)[](fg:252)"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[git_status]
format = '([$all_status$ahead_behind]($style))'
style = "cyan"
conflicted = "[ ⚠$count](red)"
ahead = "[ ⇡$count](green)"
behind = "[ ⇣$count](yellow)"
diverged = "[ ⇡$ahead_count⇣$behind_count](red)"
up_to_date = ""
untracked = "[ ?$count](blue)"
stashed = "[ ≡$count](purple)"
modified = "[ ●$count](yellow)"
staged = "[ ✚$count](green)"
renamed = "[ »$count](cyan)"
deleted = "[ ✘$count](red)"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
